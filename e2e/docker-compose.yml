# Local browser-test environment: WordPress + the licensed Divi theme (unpacked
# OUTSIDE the repo by setup.sh) + this plugin, read-only. Never used in CI.
name: d5svgf-e2e

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wp
  WORDPRESS_DB_PASSWORD: wp
  WORDPRESS_DB_NAME: wp

x-volumes: &volumes
  - wp:/var/www/html
  - ${DIVI_THEME_DIR:?run e2e/setup.sh}:/var/www/html/wp-content/themes/Divi:ro
  - ..:/var/www/html/wp-content/plugins/divi5-svg-filters:ro
  - ./fixtures:/fixtures:ro

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
  wp:
    image: wordpress:php8.2-apache
    depends_on: [db]
    ports: ["${E2E_PORT:-8086}:80"]
    environment:
      <<: *wp-env
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes: *volumes
  cli:
    image: wordpress:cli-php8.2
    depends_on: [db, wp]
    user: "33:33"
    environment: *wp-env
    volumes: *volumes
    profiles: [cli]

volumes:
  wp:
